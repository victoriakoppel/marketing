name: Текущий кинопрокат — ежедневный сбор

# 06:00 по Алматы (UTC+6) = 00:00 UTC.
# Ровно эта строка отвечает за фразу «новая точка появляется после сбора в 06:00».
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Источник данных"
        type: choice
        options: [kino, ticketon, kinopark]
        default: kino
      mode:
        description: "Что сделать"
        type: choice
        options: [собрать данные, только разведка]
        default: собрать данные
      city:
        description: "Город"
        default: almaty

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r kinoprokat/collector/requirements.txt

      - name: Собрать срез
        working-directory: kinoprokat
        run: |
          python collector/collect.py \
            --source "${{ inputs.source || 'kino' }}" \
            --city "${{ inputs.city || 'almaty' }}"

      - name: Закоммитить снимок
        if: inputs.mode != 'только разведка'
        run: |
          git config user.name "kinoprokat-bot"
          git config user.email "actions@github.com"
          git add kinoprokat/data
          if git diff --staged --quiet; then
            echo "Данные не изменились — коммит не нужен."
          else
            git commit -m "Снимок афиши за $(date -u -d '+6 hours' +%Y-%m-%d)"
            git push
          fi
